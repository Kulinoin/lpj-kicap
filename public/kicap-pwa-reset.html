<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, proxy-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reset Kicap PWA Cache</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#172d57;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    .card{width:min(420px,100%);background:white;border-radius:28px;box-shadow:0 18px 45px rgba(15,23,42,.10);padding:28px;text-align:center}
    h1{margin:0 0 10px;font-size:24px;line-height:1.15}
    p{margin:0 0 18px;color:#64748b;font-weight:700;line-height:1.5}
    .status{margin-top:14px;padding:14px;border-radius:18px;background:#ecfdf5;color:#047857;font-weight:900;font-size:14px}
    button,a{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:18px;background:#10b981;color:white;font-weight:900;text-decoration:none;font-size:15px}
    .secondary{margin-top:10px;background:#e2e8f0;color:#172d57}
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset Cache PWA</h1>
    <p>Membersihkan service worker dan cache lokal agar tampilan terbaru muncul.</p>
    <button id="resetButton" type="button">Reset Cache Sekarang</button>
    <a class="secondary" href="/app?fresh=1">Buka App</a>
    <div id="status" class="status">Siap reset.</div>
  </main>

  <script>
    const statusEl = document.getElementById('status');

    async function resetPwaCache() {
      statusEl.textContent = 'Membersihkan cache...';

      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }

        try {
          localStorage.removeItem('kicap:pwa:activeNav');
          localStorage.removeItem('kicap:pwa:selectedLpjId');
          sessionStorage.clear();
        } catch (e) {}

        statusEl.textContent = 'Cache berhasil dibersihkan. Membuka app...';

        setTimeout(() => {
          window.location.href = '/app?fresh=' + Date.now();
        }, 900);
      } catch (error) {
        console.error(error);
        statusEl.textContent = 'Reset selesai sebagian. Tekan Buka App.';
      }
    }

    document.getElementById('resetButton').addEventListener('click', resetPwaCache);
    resetPwaCache();
  </script>
</body>
</html>
